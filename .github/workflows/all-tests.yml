name: All Tests

on:
  pull_request:
    branches:
      - main
    # `edited` is not in the default type set, so retargeting a stacked PR onto
    # main did not start a run and the required `all-tests` check could never
    # appear.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A title or body edit must not cancel the run a push just started.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from) }}

jobs:
  sim:
    name: sim
    # Title and body edits share the head SHA with the run already in
    # progress. Skip them. Retargets fall through.
    if: github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the simulator image
        run: docker build -t upycore-sim:local .

      - name: Hello, raise, and the peripheral model
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work upycore-sim:local make test

  # Keep this job id/name so existing branch protection on "all-tests" still
  # matches.
  all-tests:
    name: all-tests
    needs: [sim]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require the simulator job
        if: github.event.action != 'edited' || github.event.changes.base.ref.from
        run: |
          set -euo pipefail
          test "${{ needs.sim.result }}" = "success"
